name: Native releases

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: native-release-${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'pull_request' && github.ref || 'dev' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  QLOVER_CACHE_DIR: ""
  QLOVER_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || 'dev' }}
  QLOVER_RELEASE_ID: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

jobs:
  quality:
    if: github.event_name != 'release'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.3"
          elixir-version: "1.20.2"
      - run: mix local.hex --force
      - run: mix deps.get --check-locked
      - run: bash scripts/check

  native:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            rust_targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
            targets: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
            cross: true
          - os: macos-15
            name: macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            targets: aarch64-apple-darwin x86_64-apple-darwin
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: ${{ matrix.name }}
      - uses: taiki-e/install-action@cross
        if: matrix.cross
      - run: bash scripts/build-release-targets dist $TARGETS
        env:
          TARGETS: ${{ matrix.targets }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-native-${{ matrix.name }}
          path: dist/qlover-*
          if-no-files-found: error

  package:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.3"
          elixir-version: "1.20.2"
      - run: mix local.hex --force
      - run: mix deps.get --check-locked
      - name: Build Mix package and documentation
        run: |
          mix hex.build
          mix docs --warnings-as-errors
          mkdir -p dist
          version=$(tr -d '[:space:]' < VERSION)
          cp "qlover-$version.tar" "dist/qlover-$QLOVER_RELEASE_ID.tar"
          tar -czf "dist/qlover-$QLOVER_RELEASE_ID-docs.tar.gz" -C doc .
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/qlover-*
          if-no-files-found: error

  promote:
    if: github.event_name == 'release'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.3"
          elixir-version: "1.20.2"
      - run: mix local.hex --force
      - run: mix deps.get --check-locked
      - run: bash scripts/check-release-version "$QLOVER_RELEASE_TAG"
      - name: Promote the tested push artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          QLOVER_SOURCE_ID: ${{ github.sha }}
        run: |
          run_id=$(gh run list --workflow release.yml --event push --commit "$GITHUB_SHA" \
            --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$run_id" || { echo "No push build found for $GITHUB_SHA" >&2; exit 1; }
          gh run watch "$run_id" --exit-status --compact
          gh run download "$run_id" --pattern 'release-*' --dir promoted-input
          bash scripts/promote-release-assets promoted-input dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-promoted
          path: dist/qlover-*
          if-no-files-found: error

  publish:
    if: >-
      always() && github.event_name != 'pull_request' &&
      ((needs.native.result == 'success' && needs.package.result == 'success') || needs.promote.result == 'success')
    needs: [native, package, promote]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums for the four binaries, package and docs
        run: |
          test "$(find dist -maxdepth 1 -type f -name 'qlover-*' | wc -l)" -eq 6
          (cd dist && sha256sum qlover-* > SHA256SUMS)
      - name: Replace rolling dev release
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" || true
          gh release create dev dist/* --target "$GITHUB_SHA" --prerelease \
            --title "qlover dev (${GITHUB_SHA::7})" \
            --notes "Commit-addressed native binaries, package and docs for $GITHUB_SHA."
      - name: Upload stable release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$QLOVER_RELEASE_TAG" dist/* --clobber
      - name: Mark stable release as latest
        if: github.event_name == 'release' && !github.event.release.prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$QLOVER_RELEASE_TAG" --latest
      - uses: erlef/setup-beam@v1
        if: github.event_name == 'release' && !github.event.release.prerelease
        with:
          otp-version: "29.0.3"
          elixir-version: "1.20.2"
      - name: Publish Mix package and documentation to Hex
        if: github.event_name == 'release' && !github.event.release.prerelease
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          test -n "$HEX_API_KEY" || { echo 'HEX_API_KEY secret is required' >&2; exit 1; }
          mix local.hex --force
          mix deps.get --check-locked
          mix hex.publish --yes
